server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # La PWA es una sola página: cualquier ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker no se cachea: si no, una versión vieja seguiría
    # sirviéndose tras desplegar una nueva.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los assets llevan hash en el nombre, así que pueden cachearse siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
